<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700&display=swap"
    />
    <title>Luis Krötz CMS</title>
  </head>
  <body>
    <div id="cms"></div>
    <script>
      // Dev-only stale-SW eviction — runs before the module bundle so a
      // leftover production worker cannot replay an old precached CMS page
      // (the in-bundle dropStaleServiceWorkers would never get to run).
      // Production hosts keep their service worker.
      if (
        /^(localhost|127\.|0\.0\.0\.0|\[::1\]|10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[0-1])\.)/.test(
          location.hostname
        ) &&
        navigator.serviceWorker &&
        navigator.serviceWorker.getRegistrations
      ) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          for (var i = 0; i < regs.length; i++) regs[i].unregister()
        })
      }
    </script>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
